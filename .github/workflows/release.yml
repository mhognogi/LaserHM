# Builds LaserHM installers and attaches them to a draft GitHub Release.
# Runs when a version tag (e.g. v0.1.0) is pushed.
# Windows (x64-setup.exe) and macOS (one universal .dmg for Apple Silicon and Intel Macs).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # needed to create the release and upload files
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # One app for both Mac processors: Apple Silicon (M1+) and Intel.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal Mac app is built for both processors
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # __VERSION__ is replaced with the app version
          releaseName: 'LaserHM v__VERSION__'
          releaseBody: 'Download the installer for your system from the Assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
